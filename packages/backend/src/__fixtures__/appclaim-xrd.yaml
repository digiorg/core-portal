apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: applications.platform.digiorg.io
spec:
  group: platform.digiorg.io
  names:
    kind: Application
    plural: applications
  claimNames:
    kind: AppClaim
    plural: appclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appName:
                  description: The workload identity and namespace created by Crossplane
                  type: string
                parameters:
                  type: object
                  properties:
                    repository:
                      type: string
                services:
                  type: array
                  items:
                    type: object
                    required: [name, image, port]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      port:
                        type: integer
                      build:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: false
                          context:
                            type: string
                            default: '.'
status:
  controllers:
    compositeResourceType:
      apiVersion: platform.digiorg.io/v1alpha1
      kind: Application
    compositeResourceClaimType:
      apiVersion: platform.digiorg.io/v1alpha1
      kind: AppClaim
