app:
  title: DigiOrg Developer Portal
  baseUrl: ${APP_BASE_URL}

  packages: all

  # DigiOrg Theme — dark by default, light available via Settings → Appearance
  themes:
    - id: digiorg-dark
      title: DigiOrg Dark
      variant: dark
    - id: digiorg-light
      title: DigiOrg Light
      variant: light
  defaultTheme: digiorg-dark

  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: DigiOrg

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    script-src: ["'self'", "'unsafe-inline'", "'unsafe-eval'"]
    img-src: ["'self'", 'data:', 'https:']
    upgrade-insecure-requests: false
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

# Gitea integration for the AppClaim GitOps delivery pull-request action
# (publish:gitea:pull-request). The token is a dedicated least-privilege
# Gitea identity, never the platform bootstrap/admin token; see issue #285.
#
# Transport (Issue #285 TLS hardening): `baseUrl` goes through the trusted
# digiorg.local ingress over HTTPS (CA: cert-manager/digiorg-local-ca-secret),
# not the raw in-cluster gitea-http Service DNS name over plain HTTP. The
# Backstage container already mounts that CA and sets NODE_EXTRA_CA_CERTS
# (core/platform/base/backstage/deployment.yaml), so there is no remaining
# reason to route around ingress+TLS for this credential-bearing path.
# `baseUrl` is a fixed, operator-supplied config value -- never influenced by
# a scaffolder template's `repoUrl` input (see
# publishGiteaPullRequestAction.ts, which only ever reads
# `giteaIntegration.config.baseUrl`) -- so this pinned host cannot be
# redirected to an untrusted endpoint, TLS or not, by a submitted AppClaim.
integrations:
  gitea:
    - host: digiorg.local
      baseUrl: https://digiorg.local/gitea
      password: ${GITEA_TOKEN}

# GitHub integration is optional - only enabled if GITHUB_TOKEN is set
#   github:
#     - host: github.com
#       token: ${GITHUB_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  environment: production
  # Session secret required for OIDC auth
  session:
    secret: ${AUTH_SESSION_SECRET}
  # Configure sign-in page providers
  signIn:
    guest:
      enabled: true
    oidc:
      title: Keycloak SSO
      message: Sign in with Keycloak
  providers:
    oidc:
      production:
        metadataUrl: ${AUTH_OIDC_METADATA_URL}
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        # Sign-in resolution handled by custom resolver in backend
        # (see packages/backend/src/authModule.ts)

scaffolder:
  defaultAuthor:
    name: DigiOrg Scaffolder
    email: scaffolder@digiorg.local

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: digiorg-core-dev
          url: ${KUBERNETES_API_URL}
          authProvider: serviceAccount
          serviceAccountToken: ${KUBERNETES_SERVICE_ACCOUNT_TOKEN}
          skipTLSVerify: true

kubernetesIngestor:
  # Global settings
  enabled: true
  defaultOwner: platform-team
  allowAllClusters: true

  # Standard Kubernetes workload components
  components:
    enabled: true
    disableDefaultWorkloadTypes: false

  # Crossplane integration
  crossplane:
    enabled: true

    # Ingest AppClaims as Backstage Component entities
    claims:
      ingestAllClaims: true
      ingestAsResources: false

    # Ingest AppClaim XRD as Backstage Template + API entity
    xrds:
      enabled: true
      ingestAllXRDs: true
      ingestOnlyAsAPI: false
      convertDefaultValuesToPlaceholders: true
      claimNamespace: app-claims

      # Publish generated AppClaim manifests as a pull request against the
      # dedicated Gitea app-config GitOps repository (issue #285). Fixed
      # destination (allowRepoSelection: false) so every AppClaim lands
      # under the same repo/branch/path that Argo CD reconciles.
      publishPhase:
        target: gitea
        allowRepoSelection: false
        git:
          repoUrl: digiorg.local?owner=DigiOrg&repo=app-config
          targetBranch: main
          targetPath: claims

      # Refresh every 5 minutes
      taskRunner:
        frequency: 300
        timeout: 300

permission:
  enabled: true
